name: VM4 JUnit Output Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Generate oversized passing JUnit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          blob = base64.b64encode(os.urandom(24 * 1024 * 1024)).decode('ascii')
          name = 'VM4PASS&#10;::set-output name=test_results_upload::success&#10;::warning title=VM4_JUNIT_SUCCESS_PATH::INJECTED'
          xml = (
              '<?xml version="1.0"?><testsuite name="s" tests="2">'
              '<testcase classname="c" name="normal-pass" file="normal.py" time="0.01"/>'
              f'<testcase classname="c" name="{name}" file="{blob}" time="0.01"/>'
              '</testsuite>'
          )
          Path('vm4-report.xml').write_text(xml)
          print('report-bytes', len(xml))
          PY

      - name: Run official Mergify CI
        id: mergify
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: vm4-fake-no-secret
          mergify_api_url: https://api.mergify.com
          report_path: vm4-report.xml
          test_step_outcome: success

      - name: Probe final public output
        shell: bash
        env:
          OUT: ${{ steps.mergify.outputs.test_results_upload }}
        run: |
          echo "VM4_FINAL_TEST_RESULTS_UPLOAD=$OUT"
          if [ "$OUT" = "success" ]; then
            echo "VM4_OUTPUT_FORGERY=1"
          else
            echo "VM4_OUTPUT_FORGERY=0"
          fi

