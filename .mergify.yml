merge_queue:
  mode: parallel
  max_parallel_checks: 3

scopes:
  source:
    files:
      alpha:
        include:
          - scope-alpha/**
      beta:
        include:
          - scope-beta/**
      gamma:
        include:
          - scope-gamma/**
  capacities:
    alpha: 1
    beta: 1
    gamma: 1

queue_rules:
  - name: VM4 multi-scope simultaneous capacity reservation probe
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = VM4_MULTI_SCOPE_HOLD_NEVER
