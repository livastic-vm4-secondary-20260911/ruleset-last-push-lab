pull_request_rules:
  - name: required-team-merge-probe
    conditions:
      - label = vm4-required-team-go
    actions:
      merge:
        method: squash

merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = VM4_DEQUEUE_REASON_HOLD_NEVER
    merge_method: merge
